<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kahvi | Data Platform Engineer &amp; ML Researcher</title>
    <meta
      name="description"
      content="Kahvi builds entity-resolution pipelines for national data, hybrid search engines and small-data ML. Available for consulting on data, ML and product engineering."
    />
    <meta name="author" content="Muhammad Kahvi Khakam Syah" />
    <meta name="theme-color" content="#09090b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kahvi | Data Platform Engineer & ML Researcher" />
    <meta
      property="og:description"
      content="Entity resolution for national data, hybrid search and small-data ML. Projects, research and consulting."
    />
    <meta name="twitter:card" content="summary" />

    <!-- Apply the saved or system theme before first paint to avoid a flash. -->
    <script>
      ;(function () {
        var root = document.documentElement
        var dark = true
        try {
          var saved = localStorage.getItem('theme')
          dark = saved
            ? saved === 'dark'
            : !window.matchMedia('(prefers-color-scheme: light)').matches
        } catch (e) {}
        root.classList.toggle('dark', dark)
        root.style.colorScheme = dark ? 'dark' : 'light'
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#09090b' : '#fafafa')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
